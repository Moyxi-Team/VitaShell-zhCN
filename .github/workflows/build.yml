name: Build VitaShell VPK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull VitaSDK image
        run: docker pull vitasdk/vitasdk:latest

      - name: Inspect toolchain
        run: |
          docker run --rm vitasdk/vitasdk:latest /bin/bash -c '
            echo "VITASDK=$VITASDK"
            ls "$VITASDK" | head
            echo "--- libs ---"
            ls "$VITASDK/arm-vita-eabi/lib" | grep -E "vita2d|ftpvita|quirc|onigmo|archive|curl|ssl|expat" || true
            echo "--- vdpm ---"
            which vdpm && vdpm 2>&1 | head -n 20 || true
          '

      - name: Install extra libraries
        run: |
          docker run --rm -v "$PWD":/build -w /build vitasdk/vitasdk:latest /bin/bash -c '
            set -x
            for pkg in xz libarchive quirc taihen; do
              vdpm "$pkg" || echo "FAILED: $pkg"
            done
            ls "$VITASDK/arm-vita-eabi/lib" | grep -E "quirc|archive|lzma" || true
          '

      - name: Configure and build
        run: |
          docker run --rm -v "$PWD":/build -w /build vitasdk/vitasdk:latest /bin/bash -c '
            set -e
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
          '

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/eboot.bin dist/ 2>/dev/null || true
          cp build/VitaShell.vpk dist/ 2>/dev/null || true
          ls -l dist

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaShell-zhCN-vpk
          path: |
            dist/VitaShell.vpk
            dist/eboot.bin
          if-no-files-found: warn
