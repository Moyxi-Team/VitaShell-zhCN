name: Build VitaShell VPK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull VitaSDK image
        run: docker pull vitasdk/vitasdk:latest

      - name: Inspect toolchain
        run: |
          docker run --rm vitasdk/vitasdk:latest /bin/bash -c '
            echo "VITASDK=$VITASDK"
            which vdpm || true
            echo "--- zstd / archive libs ---"
            ls "$VITASDK/arm-vita-eabi/lib" | grep -iE "zstd|archive|lzma" || true
            echo "--- current TAI_CONTINUE ---"
            grep -n -A6 "define TAI_CONTINUE" "$VITASDK/arm-vita-eabi/include/taihen.h" || true
          '

      # IMPORTANT: vdpm install and the actual build MUST run inside the SAME container.
      # The previous version installed packages in a `docker run --rm` container, so every
      # package (including taihen) was thrown away when that container exited. The build then
      # used the image's old taihen.h whose TAI_CONTINUE expands to `(type(*)(void))`, which
      # makes GCC reject the arguments: "too many arguments to function '(SceUID (*)(void))cur->old'".
      - name: Install libraries and build
        run: |
          docker run --rm -v "$PWD":/build -w /build vitasdk/vitasdk:latest /bin/bash -c '
            set -eux
            for pkg in xz libarchive quirc taihen zstd; do
              vdpm "$pkg" || echo "vdpm $pkg reported an error, continuing"
            done
            ls "$VITASDK/arm-vita-eabi/lib" | grep -iE "zstd|archive|lzma" || true
            echo "--- TAI_CONTINUE definition now in effect ---"
            grep -n -A6 "define TAI_CONTINUE" "$VITASDK/arm-vita-eabi/include/taihen.h" || true
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
          '

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/VitaShell.vpk dist/ 2>/dev/null || true
          cp build/eboot.bin dist/ 2>/dev/null || true
          ls -l dist

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaShell-zhCN-vpk
          path: |
            dist/VitaShell.vpk
            dist/eboot.bin
          if-no-files-found: warn
